site_name: TSI AutoPeças — REQ 2026.2 T02
site_description: Documentação do projeto TSI AutoPeças para a disciplina de Requisitos de Software.
site_url: https://mdsreq-fga-unb.github.io/REQ-202562-T02-TSI-AutoPecas/

repo_name: mdsreq-fga-unb/REQ-202562-T02-TSI-AutoPecas
repo_url: https://github.com/mdsreq-fga-unb/REQ-202562-T02-TSI-AutoPecas
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Início: index.md
  - Visão do Produto e Projeto:
      - visao-produto/index.md
      - O Negócio e o Problema:
          - Cliente e negócio: visao-produto/cliente-e-negocio.md
          - Cenário, problema e desafios: visao-produto/cenario-problema-e-desafios.md
          - Stakeholders e segmentação: visao-produto/stakeholders-e-segmentacao.md
      - A Solução e o Impacto:
          - Solução e características: visao-produto/solucao-e-caracteristicas.md
          - Intervenção social: visao-produto/intervencao-social.md
      - Estratégia e Engenharia:
          - Estratégias de engenharia de software: visao-produto/estrategias-engenharia-de-software.md
          - Engenharia de requisitos: visao-produto/engenharia-de-requisitos.md
      - Planejamento e Alinhamento:
          - Cronograma e entregas: visao-produto/cronograma-e-entregas.md
          - Interação entre equipe e cliente: visao-produto/interacao-equipe-cliente.md
      - Especificação e Backlog:
          - Requisitos de software: visao-produto/requisitos-de-software.md
          - DoR e DoD: visao-produto/dor-e-dod.md
          - Backlog de produto: visao-produto/backlog-de-produto.md
      - Evolução do Projeto:
          - Lições aprendidas: visao-produto/licoes-aprendidas.md
