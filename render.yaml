services:
  - type: web
    name: tsi-pecas-api
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
