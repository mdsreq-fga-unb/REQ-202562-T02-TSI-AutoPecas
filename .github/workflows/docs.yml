name: Publish documentation and backlog

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  issue_comment:
    types: [created, edited, deleted]
  # Publicação sempre executa o código confiável da main, nunca o código do PR.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: documentation-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: python -m pip install -r tools/docs/requirements.txt
      - name: Validate backlog and automation
        run: python -m unittest discover -s tools/docs/tests -t tools/docs -v
      - name: Read issues, epics, pull requests and commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: token com leitura do Project da organização.
          BACKLOG_PROJECT_TOKEN: ${{ secrets.BACKLOG_PROJECT_TOKEN }}
        run: python tools/docs/scripts/backlog.py sync
      - name: Check collected data
        run: python tools/docs/scripts/backlog.py check
      - name: Validate generated documentation
        run: |
          mkdocs build --strict
          python tools/docs/scripts/check_links.py site
      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish generated catalog
        run: mkdocs gh-deploy --force --strict
