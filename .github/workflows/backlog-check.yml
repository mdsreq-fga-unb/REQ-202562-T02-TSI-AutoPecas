name: Validate documentation changes

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'hooks/**'
      - 'tests/**'
      - 'docs/**'
      - 'overrides/**'
      - '.github/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/backlog.py check
      # Build offline: sem acesso a secrets e sem publicar código de PRs.
      - run: mkdocs build --strict
      - run: python scripts/check_links.py site
