name: Validate documentation changes

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/**'
      - 'mkdocs.yml'
      - 'tools/docs/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/docs/requirements.txt
      - run: python -m unittest discover -s tools/docs/tests -t tools/docs -v
      - run: python tools/docs/scripts/backlog.py check
      # Build offline: sem acesso a secrets e sem publicar código de PRs.
      - run: mkdocs build --strict
      - run: python tools/docs/scripts/check_links.py site
